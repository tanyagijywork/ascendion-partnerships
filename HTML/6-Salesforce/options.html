<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salesforce Implementation — Layout Options</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #f4f4f4; }

    .switcher {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: #000;
      display: flex; align-items: center; gap: 0;
      height: 48px; padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .switcher-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      margin-right: 24px; white-space: nowrap;
    }
    .tab-btn {
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.5); background: none; border: none;
      padding: 0 20px; height: 100%; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #2ddcaa; border-bottom-color: #2ddcaa; }

    .frame-wrap {
      position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
    }
    iframe {
      width: 100%; height: 100%; border: none;
      display: none;
    }
    iframe.active { display: block; }
  </style>
</head>
<body>

  <div class="switcher">
    <span class="switcher-label">Layout Options</span>
    <button class="tab-btn active" data-target="frame-a">Option A — Accordion</button>
    <button class="tab-btn" data-target="frame-b">Option B — Accordion + Icons</button>
    <button class="tab-btn" data-target="frame-c">Option C — Tabs + Cover Image</button>
  </div>

  <div class="frame-wrap">
    <iframe id="frame-a" class="active" src="option-a.html" title="Option A — Accordion"></iframe>
    <iframe id="frame-b" src="option-b.html" title="Option B — Accordion with Icons"></iframe>
    <iframe id="frame-c" src="option-c.html" title="Option C — Tabs + Cover Image"></iframe>
  </div>

  <script>
    const buttons = document.querySelectorAll('.tab-btn');
    const frames  = document.querySelectorAll('iframe');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        frames.forEach(f  => f.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });
  </script>

</body>
</html>
